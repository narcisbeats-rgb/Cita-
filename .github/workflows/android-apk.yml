name: Android interpreter APK
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'interpreter.js'
      - 'public/interpreter.html'
      - 'public/phone-beta.html'
      - 'index.html'
      - 'scripts/**'
      - 'server.js'
      - 'caller-identity.js'
      - 'caller-accounts.js'
      - 'public/account.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/caller_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: caller_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caller_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server JavaScript syntax
        run: |
          node --check server.js
          node --check interpreter.js
          node --check caller-identity.js
          node --check caller-accounts.js
          node scripts/check-own-number.mjs
          node scripts/check-interpreter-ui.mjs
          node scripts/check-phone-beta.mjs
      - name: Test own-number call flow without charging provider
        run: |
          npm install --ignore-scripts
          node scripts/integration-own-number-call.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: traducere-live-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
