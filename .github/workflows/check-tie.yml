name: Check Madrid TIE availability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-madrid-tie
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Madrid time
        id: madrid_time
        shell: bash
        run: |
          hour="$(TZ=Europe/Madrid date +%H)"
          weekday="$(TZ=Europe/Madrid date +%u)"
          if [[ "$weekday" -le 5 && "$hour" =~ ^(08|09|10|11|12|13)$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.madrid_time.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.madrid_time.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.madrid_time.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.madrid_time.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run safe TIE check
        if: steps.madrid_time.outputs.run == 'true'
        env:
          SAFE_MODE: 'true'
          HEADLESS: 'true'
        run: npm run check:tie
