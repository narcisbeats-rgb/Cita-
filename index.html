<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Apel RO ↔ DA</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#f5f7fb;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px 16px 40px}
h1{font-size:34px;margin:4px 0 6px}.sub{color:#aeb7c8;line-height:1.45;margin:0 0 18px}
.card{background:#141821;border:1px solid #252b38;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.18)}
label{font-size:13px;color:#aeb7c8;display:block;margin:0 0 7px}input,select{width:100%;background:#0f131a;color:white;border:1px solid #313a4b;border-radius:14px;padding:14px;font-size:17px;outline:none}
input:focus,select:focus{border-color:#6e8cff}.row{display:grid;grid-template-columns:1fr 110px;gap:10px}.mode{margin-bottom:12px}
button{width:100%;border:0;border-radius:16px;min-height:54px;font-size:17px;font-weight:750;cursor:pointer}
button:disabled{opacity:.42;cursor:not-allowed}.call{background:#eef2fa;color:#0b0d12;margin-top:12px}
.hang{background:#361c22;color:#ffd8df;border:1px solid #63303b;margin-top:10px}.ptt{min-height:126px;background:#355fe8;color:white;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none;margin-top:12px}
.ptt.on{background:#264bd0;transform:scale(.985)}.status{display:inline-flex;gap:8px;align-items:center;background:#0f131a;border-radius:99px;padding:8px 11px;color:#c7d0df;font-size:13px}
.dot{width:9px;height:9px;background:#697386;border-radius:50%}.dot.live{background:#55d187;box-shadow:0 0 0 4px rgba(85,209,135,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pane{background:#0f131a;border:1px solid #252b38;border-radius:14px;padding:12px;min-height:120px}
.pane h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9ba6b8;margin:0 0 8px}.pane p{white-space:pre-wrap;line-height:1.45;margin:0}
.note{font-size:12px;color:#8792a5;line-height:1.4;margin-top:10px}.err{color:#ffb6c2;min-height:20px;margin-top:8px}
@media(max-width:580px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 95px}h1{font-size:30px}}
</style>
</head>
<body>
<main class="wrap">
<h1 id="title">Apel RO ↔ DA</h1>
<p id="subtitle" class="sub">Tu vorbești română. Cealaltă persoană aude daneză. Când răspunde în daneză, tu auzi română.</p>

<section class="card">
  <div class="mode">
    <label for="language">Limba ta</label>
    <select id="language">
      <option value="ro">Română ↔ Daneză</option>
      <option value="es">Spaniolă ↔ Daneză</option>
    </select>
  </div>
  <div class="row">
    <div><label for="phone">Număr telefon</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="+45 12 34 56 78"></div>
    <div><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"></div>
  </div>
  <button id="call" class="call">Sună</button>
  <div id="err" class="err"></div>
</section>

<section class="card">
  <div class="status"><span id="dot" class="dot"></span><span id="status">Pregătit</span></div>
  <button id="ptt" class="ptt" disabled>ȚINE APĂSAT ȘI VORBEȘTE ÎN ROMÂNĂ</button>
  <button id="hang" class="hang" disabled>Închide apelul</button>
</section>

<section class="card">
  <div class="grid">
    <div class="pane"><h3 id="youHeading">Tu → daneză</h3><p id="youDa"></p></div>
    <div class="pane"><h3 id="themHeading">Ei → română</h3><p id="themLocal"></p></div>
  </div>
</section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const phone=$("phone"),pin=$("pin"),language=$("language"),call=$("call"),hang=$("hang"),ptt=$("ptt"),statusEl=$("status"),dot=$("dot"),err=$("err");
  const title=$("title"),subtitle=$("subtitle"),youHeading=$("youHeading"),themHeading=$("themHeading");
  const panes={"you-da":$("youDa"),"them-local":$("themLocal")};
  let sid=null,token=null,ws=null,ctx=null,mic=null,src=null,proc=null,gain=null,talking=false,live=false,playAt=0;

  function setStatus(text,on=false){statusEl.textContent=text;dot.classList.toggle("live",on)}
  function setError(text=""){err.textContent=text}
  function languageInfo(){
    return language.value==="es"
      ? {short:"ES",name:"spaniolă",upper:"SPANIOLĂ"}
      : {short:"RO",name:"română",upper:"ROMÂNĂ"};
  }
  function updateLanguageUi(){
    const l=languageInfo();
    title.textContent="Apel "+l.short+" ↔ DA";
    subtitle.textContent="Tu vorbești "+l.name+". Cealaltă persoană aude daneză. Când răspunde în daneză, tu auzi "+l.name+".";
    youHeading.textContent="Tu → daneză";
    themHeading.textContent="Ei → "+l.name;
    ptt.textContent="ȚINE APĂSAT ȘI VORBEȘTE ÎN "+l.upper;
  }
  function bytesToB64(bytes){let out="";for(let i=0;i<bytes.length;i+=32768)out+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(out)}
  function b64ToBytes(text){const s=atob(text),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}

  function resample(input,fromRate,toRate){
    if(fromRate===toRate)return input;
    const ratio=fromRate/toRate;
    const n=Math.max(1,Math.round(input.length/ratio));
    const out=new Float32Array(n);
    for(let i=0;i<n;i++){
      const pos=i*ratio,idx=Math.floor(pos),frac=pos-idx;
      const a=input[Math.min(idx,input.length-1)]||0;
      const b=input[Math.min(idx+1,input.length-1)]||a;
      out[i]=a+(b-a)*frac;
    }
    return out;
  }

  function pcm16Base64(floatData){
    const pcm=new Int16Array(floatData.length);
    for(let i=0;i<floatData.length;i++){
      const v=Math.max(-1,Math.min(1,floatData[i]));
      pcm[i]=v<0?Math.round(v*32768):Math.round(v*32767);
    }
    return bytesToB64(new Uint8Array(pcm.buffer));
  }

  async function prepareAudio(){
    if(ctx&&mic)return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    src=ctx.createMediaStreamSource(mic);
    proc=ctx.createScriptProcessor(4096,1,1);
    gain=ctx.createGain();
    gain.gain.value=0;
    src.connect(proc);proc.connect(gain);gain.connect(ctx.destination);

    proc.onaudioprocess=e=>{
      if(!talking||!live||!ws||ws.readyState!==WebSocket.OPEN)return;
      const raw=e.inputBuffer.getChannelData(0);
      const pcm=resample(raw,ctx.sampleRate,24000);
      ws.send(JSON.stringify({type:"mic",audio:pcm16Base64(pcm)}));
    };
  }

  function playPcm16(base64){
    if(!ctx)return;
    const bytes=b64ToBytes(base64);
    const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
    const samples=new Float32Array(Math.floor(bytes.byteLength/2));
    for(let i=0;i<samples.length;i++)samples[i]=view.getInt16(i*2,true)/32768;
    const buffer=ctx.createBuffer(1,samples.length,24000);
    buffer.copyToChannel(samples,0);
    const node=ctx.createBufferSource();
    node.buffer=buffer;
    node.connect(ctx.destination);
    const now=ctx.currentTime;
    if(playAt<now+.03)playAt=now+.03;
    node.start(playAt);
    playAt+=buffer.duration;
  }

  function connectAppSocket(){
    const scheme=location.protocol==="https:"?"wss":"ws";
    ws=new WebSocket(scheme+"://"+location.host+"/client?sid="+encodeURIComponent(sid)+"&token="+encodeURIComponent(token));

    ws.onmessage=e=>{
      let m;try{m=JSON.parse(e.data)}catch{return}
      if(m.type==="status"){
        const names={
          "app-connected":"Aplicația este conectată",
          initiated:"Se inițiază apelul…",
          ringing:"Sună…",
          answered:"A răspuns",
          "call-audio-live":"Traducerea este live", "audio-connected":"Audio conectat",
          completed:"Apel încheiat",
          busy:"Ocupat",
          failed:"Apel eșuat",
          "no-answer":"Nu a răspuns",
          canceled:"Apel anulat"
        };
        if(m.status==="call-audio-live")live=true;
        if(["completed","busy","failed","no-answer","canceled"].includes(m.status))live=false;
        setStatus(names[m.status]||m.status,live);
        ptt.disabled=!live;
        if(!live&&["completed","busy","failed","no-answer","canceled"].includes(m.status))finishUi();
      } else if(m.type==="audio"&&m.audio){
        playPcm16(m.audio);
      } else if(m.type==="text"&&panes[m.lane]){
        panes[m.lane].textContent+=m.delta||"";
      } else if(m.type==="error"){
        setError(m.message||"Eroare");
      }
    };

    ws.onclose=()=>{if(sid&&!live)setStatus("Conexiunea aplicației s-a închis")};
  }

  async function startCall(){
    setError("");
    call.disabled=true;
    try{
      await prepareAudio();
      const response=await fetch("/api/call",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({to:phone.value,pin:pin.value,language:language.value})
      });
      const data=await response.json();
      if(!response.ok)throw new Error(data.error||"Nu am putut porni apelul");
      sid=data.sessionId;
      token=data.token;
      connectAppSocket();
      hang.disabled=false;
      setStatus("Se inițiază apelul…");
    }catch(e){
      setError(e.message||String(e));
      call.disabled=false;
    }
  }

  async function hangup(){
    if(!sid)return;
    hang.disabled=true;
    try{
      await fetch("/api/hangup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({sessionId:sid,token})
      });
    }catch{}
    try{ws?.close()}catch{}
    sid=null;token=null;ws=null;
    finishUi();
    setStatus("Apel încheiat");
  }

  function finishUi(){
    live=false;talking=false;
    ptt.disabled=true;
    ptt.classList.remove("on");
    ptt.textContent="ȚINE APĂSAT ȘI VORBEȘTE ÎN "+languageInfo().upper;
    hang.disabled=true;
    call.disabled=false;
  }

  function press(e){
    if(ptt.disabled)return;
    e.preventDefault();
    talking=true;
    ptt.classList.add("on");
    ptt.textContent="VORBEȘTE…";
  }

  function release(e){
    e?.preventDefault?.();
    if(!talking)return;
    talking=false;
    ptt.classList.remove("on");
    ptt.textContent="ȚINE APĂSAT ȘI VORBEȘTE ÎN "+languageInfo().upper;
    if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"ptt-end"}));
  }

  language.addEventListener("change",updateLanguageUi);
  updateLanguageUi();
  call.addEventListener("click",startCall);
  hang.addEventListener("click",hangup);
  ptt.addEventListener("pointerdown",press);
  ptt.addEventListener("pointerup",release);
  ptt.addEventListener("pointercancel",release);
  ptt.addEventListener("pointerleave",e=>{if(talking)release(e)});
})();
</script>
</body>
</html>
