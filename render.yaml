services:
  - type: web
    name: live-ro-da-translator
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1-mini
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_FROM_NUMBER
        sync: false
      - key: TELNYX_APP_NAME
        value: Traducere Live
      - key: APP_PIN
        sync: false
      - key: PUBLIC_CALLER_ACCOUNTS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
