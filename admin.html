<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detector de Citas · Admin</title><style>
body{margin:0;background:#0b0d12;color:#f7f8fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 16px}.card{background:#121722;border:1px solid #263044;border-radius:18px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#0d131c;border:1px solid #263044;border-radius:14px;padding:14px}.kpi b{font-size:24px;display:block}.muted{color:#9ca7b8}input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #263044}input{background:#0d121a;color:white;width:100%;box-sizing:border-box}button{background:#f3c94b;font-weight:700;cursor:pointer;margin-top:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #263044}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><h1>Detector de Citas · Admin</h1><p class="muted">Resumen operativo sin mostrar datos personales de clientes.</p><div class="card"><label>Clave de administrador</label><input id="key" type="password" autocomplete="current-password"><button id="load">Abrir panel</button><div id="msg" class="muted" style="margin-top:10px"></div></div><div id="content" style="display:none"><div class="grid"><div class="kpi"><span class="muted">Activos</span><b id="active">0</b></div><div class="kpi"><span class="muted">Total</span><b id="total">0</b></div><div class="kpi"><span class="muted">Expirados</span><b id="expired">0</b></div><div class="kpi"><span class="muted">Con alerta</span><b id="alerts">0</b></div></div><div class="card" style="margin-top:14px"><h3>Trámites activos</h3><table><thead><tr><th>Trámite</th><th>Clientes</th></tr></thead><tbody id="services"></tbody></table></div><div class="card"><b>Frecuencia:</b> <span id="interval"></span> min · <b>Próxima revisión:</b> <span id="next"></span></div></div></div><script>
const key=document.getElementById('key'),msg=document.getElementById('msg');document.getElementById('load').onclick=async()=>{msg.textContent='Cargando…';const r=await fetch('/api/admin/summary',{headers:{'x-admin-key':key.value}});if(!r.ok){msg.textContent='Clave incorrecta o panel no configurado.';return}const d=await r.json();sessionStorage.setItem('detectorAdminKey',key.value);document.getElementById('content').style.display='block';msg.textContent='Panel actualizado.';active.textContent=d.active;total.textContent=d.total;expired.textContent=d.expired;alerts.textContent=d.smsAlerts;interval.textContent=d.monitorIntervalMinutes;next.textContent=d.nextCheckAt?new Date(d.nextCheckAt).toLocaleString('es-ES'):'Pendiente';services.innerHTML=Object.entries(d.byService||{}).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan="2">Sin clientes activos</td></tr>'};key.value=sessionStorage.getItem('detectorAdminKey')||'';
</script></body></html>
